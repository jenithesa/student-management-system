<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:#eef2ff;
        }

        /* ================= NAVBAR ================= */

        .navbar{
            width:100%;
            background:linear-gradient(90deg,#1e3a8a,#2563eb);
            padding:18px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            color:white;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        .navbar h2{
            font-size:28px;
        }

        .navbar a{
            text-decoration:none;
            background:white;
            color:#1e3a8a;
            padding:10px 18px;
            border-radius:10px;
            font-weight:600;
            transition:0.3s;
        }

        .navbar a:hover{
            background:#dbeafe;
        }

        /* ================= MAIN CONTAINER ================= */

        .container{
            width:90%;
            max-width:1100px;
            margin:40px auto;
        }

        .form-card{
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 8px 20px rgba(0,0,0,0.08);
        }

        .form-card h1{
            text-align:center;
            color:#1e3a8a;
            margin-bottom:35px;
            font-size:38px;
        }

        /* ================= SECTION TITLE ================= */

        .section-title{
            color:#2563eb;
            margin-bottom:20px;
            margin-top:25px;
            font-size:24px;
            font-weight:600;
        }

        /* ================= FORM GRID ================= */

        .form-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
        }

        .input-group{
            display:flex;
            flex-direction:column;
        }

        .input-group label{
            margin-bottom:8px;
            color:#333;
            font-weight:500;
        }

        .input-group input,
        .input-group select{
            padding:14px;
            border:none;
            outline:none;
            border-radius:12px;
            background:#f1f5f9;
            font-size:15px;
            transition:0.3s;
        }

        .input-group input:focus,
        .input-group select:focus{
            border:2px solid #2563eb;
            background:white;
        }

        /* ================= TABLE ================= */

        .table-container{
            overflow-x:auto;
            margin-top:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            min-width:700px;
        }

        table th{
            background:#2563eb;
            color:white;
            padding:15px;
            text-align:center;
        }

        table td{
            padding:12px;
            border:1px solid #ddd;
        }

        table input{
            width:100%;
            padding:12px;
            border:none;
            outline:none;
            background:#f8fafc;
            border-radius:8px;
        }

        /* ================= BUTTON ================= */

        .submit-btn{
            width:100%;
            margin-top:35px;
            padding:16px;
            border:none;
            border-radius:14px;
            background:#2563eb;
            color:white;
            font-size:18px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        .submit-btn:hover{
            background:#1d4ed8;
            transform:translateY(-2px);
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width:768px){

            .navbar{
                flex-direction:column;
                gap:15px;
                text-align:center;
            }

            .form-card{
                padding:25px;
            }

        }

    </style>

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <div class="navbar">

        <h2>Student Management System</h2>

        <a href="/dashboard">Dashboard</a>

    </div>

    <!-- ================= MAIN CONTENT ================= -->

    <div class="container">

        <div class="form-card">

            <h1>Add Student</h1>

            <form method="POST">

                <!-- ================= PERSONAL DETAILS ================= -->

                <div class="section-title">
                    Personal Details
                </div>

                <div class="form-grid">

                    <div class="input-group">
                        <label>Student Name</label>
                        <input type="text"
                               name="name"
                               placeholder="Enter Student Name"
                               required>
                    </div>

                    <div class="input-group">
                        <label>Roll Number</label>
                        <input type="text"
                               name="roll_number"
                               placeholder="Enter Roll Number"
                               required>
                    </div>

                    <div class="input-group">
                        <label>Register Number</label>
                        <input type="text"
                               name="register_number"
                               placeholder="Enter Register Number"
                               required>
                    </div>

                    <div class="input-group">
                        <label>Address</label>
                        <input type="text"
                               name="address"
                               placeholder="Enter Address"
                               required>
                    </div>

                    <div class="input-group">
                        <label>Department</label>
                        <input type="text"
                               name="department"
                               placeholder="Enter Department"
                               required>
                    </div>

                    <div class="input-group">
                        <label>Course</label>
                        <input type="text"
                               name="course"
                               placeholder="Enter Course"
                               required>
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email"
                               name="email"
                               placeholder="Enter Email"
                               required>
                    </div>

                    <div class="input-group">
                        <label>Date of Birth</label>
                        <input type="date"
                               name="dob"
                               required>
                    </div>

                    <div class="input-group">
                        <label>Gender</label>

                        <select name="gender" required>

                            <option value="">Select Gender</option>

                            <option value="Male">Male</option>

                            <option value="Female">Female</option>

                            <option value="Other">Other</option>

                        </select>

                    </div>

                    <div class="input-group">
                        <label>Phone Number</label>
                        <input type="tel"
                               name="phone"
                               placeholder="Enter Phone Number"
                               pattern="[0-9]{10}"
                               maxlength="10"
                               required>
                    </div>

                    <div class="input-group">
                        <label>Aadhaar Number</label>
                        <input type="text"
                               name="aadhaar"
                               placeholder="Enter Aadhaar Number"
                               pattern="[0-9]{12}"
                               maxlength="12"
                               required>
                    </div>

                </div>

                <!-- ================= EDUCATION DETAILS ================= -->

                <div class="section-title">
                    Educational Details
                </div>

                <div class="table-container">

                    <table>

                        <tr>

                            <th>Standard</th>

                            <th>Year</th>

                            <th>School / College</th>

                            <th>Marks</th>

                        </tr>

                        <!-- ROW 1 -->

                        <tr>

                            <td>
                                <input type="text"
                                       name="standard"
                                       placeholder="10th">
                            </td>

                            <td>
                                <input type="text"
                                       name="year"
                                       placeholder="2020">
                            </td>

                            <td>
                                <input type="text"
                                       name="school_college"
                                       placeholder="School Name">
                            </td>

                            <td>
                                <input type="text"
                                       name="marks"
                                       placeholder="90%">
                            </td>

                        </tr>

                        <!-- ROW 2 -->

                        <tr>

                            <td>
                                <input type="text"
                                       name="standard"
                                       placeholder="12th">
                            </td>

                            <td>
                                <input type="text"
                                       name="year"
                                       placeholder="2022">
                            </td>

                            <td>
                                <input type="text"
                                       name="school_college"
                                       placeholder="School Name">
                            </td>

                            <td>
                                <input type="text"
                                       name="marks"
                                       placeholder="85%">
                            </td>

                        </tr>

                        <!-- ROW 3 -->

                        <tr>

                            <td>
                                <input type="text"
                                       name="standard"
                                       placeholder="UG">
                            </td>

                            <td>
                                <input type="text"
                                       name="year"
                                       placeholder="2026">
                            </td>

                            <td>
                                <input type="text"
                                       name="school_college"
                                       placeholder="College Name">
                            </td>

                            <td>
                                <input type="text"
                                       name="marks"
                                       placeholder="80%">
                            </td>

                        </tr>

                    </table>

                </div>

                <!-- ================= SUBMIT BUTTON ================= -->

                <button type="submit"
                        class="submit-btn">

                    Add Student

                </button>

            </form>

        </div>

    </div>

</body>

</html>
