<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:linear-gradient(135deg,#1e3a8a,#2563eb);
            min-height:100vh;
            padding-bottom:40px;
        }

        /* ================= NAVBAR ================= */

        .navbar{
            width:100%;
            padding:20px 50px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:rgba(255,255,255,0.1);
            backdrop-filter:blur(10px);
            color:white;
        }

        .navbar h2{
            font-size:30px;
        }

        .navbar a{
            text-decoration:none;
            background:white;
            color:#1e3a8a;
            padding:12px 20px;
            border-radius:12px;
            font-weight:600;
            transition:0.3s;
        }

        .navbar a:hover{
            background:#dbeafe;
            transform:translateY(-2px);
        }

        /* ================= CONTAINER ================= */

        .container{
            width:90%;
            max-width:1200px;
            margin:40px auto;
        }

        /* ================= FORM CARD ================= */

        .form-card{
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(15px);
            padding:40px;
            border-radius:25px;
            box-shadow:0 8px 25px rgba(0,0,0,0.2);
            color:white;
        }

        .form-card h1{
            text-align:center;
            margin-bottom:35px;
            font-size:42px;
        }

        /* ================= SECTION TITLE ================= */

        .section-title{
            font-size:24px;
            margin:30px 0 20px;
            border-left:5px solid white;
            padding-left:12px;
        }

        /* ================= FORM GRID ================= */

        .form-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
        }

        .input-group{
            display:flex;
            flex-direction:column;
        }

        .input-group label{
            margin-bottom:8px;
            font-weight:500;
        }

        .input-group input,
        .input-group select{

            padding:14px;
            border:none;
            outline:none;
            border-radius:14px;
            background:rgba(255,255,255,0.2);
            color:white;
            font-size:15px;
            transition:0.3s;
        }

        .input-group input::placeholder{
            color:#e0e7ff;
        }

        .input-group input:focus,
        .input-group select:focus{
            background:white;
            color:black;
            transform:scale(1.02);
        }

        /* ================= TABLE ================= */

        .table-container{
            overflow-x:auto;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
            background:white;
            border-radius:15px;
            overflow:hidden;
        }

        table th{
            background:#1e3a8a;
            color:white;
            padding:15px;
            text-align:center;
        }

        table td{
            padding:12px;
            border:1px solid #ddd;
        }

        table input{
            width:100%;
            padding:12px;
            border:none;
            outline:none;
            border-radius:10px;
            background:#f1f5f9;
        }

        /* ================= BUTTON ================= */

        .submit-btn{
            width:100%;
            padding:16px;
            border:none;
            border-radius:15px;
            margin-top:35px;
            background:white;
            color:#1e3a8a;
            font-size:18px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        .submit-btn:hover{
            background:#dbeafe;
            transform:translateY(-3px);
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width:768px){

            .navbar{
                flex-direction:column;
                gap:15px;
                text-align:center;
            }

            .form-card{
                padding:25px;
            }

        }

    </style>

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <div class="navbar">

        <h2>
            <i class="fa-solid fa-user-pen"></i>
            Edit Student
        </h2>

        <a href="/dashboard">
            <i class="fa-solid fa-table-columns"></i>
            Dashboard
        </a>

    </div>

    <!-- ================= MAIN CONTAINER ================= -->

    <div class="container">

        <div class="form-card">

            <h1>Update Student Details</h1>

            <form method="POST">

                <!-- ================= PERSONAL DETAILS ================= -->

                <div class="section-title">
                    Personal Details
                </div>

                <div class="form-grid">

                    <div class="input-group">

                        <label>Student Name</label>

                        <input type="text"
                               name="name"
                               value="{{ student.name }}"
                               placeholder="Student Name">

                    </div>

                    <div class="input-group">

                        <label>Roll Number</label>

                        <input type="text"
                               name="roll_number"
                               value="{{ student.roll_number }}"
                               placeholder="Roll Number">

                    </div>

                    <div class="input-group">

                        <label>Register Number</label>

                        <input type="text"
                               name="register_number"
                               value="{{ student.register_number }}"
                               placeholder="Register Number">

                    </div>

                    <div class="input-group">

                        <label>Date of Birth</label>

                        <input type="date"
                               name="dob"
                               value="{{ student.dob }}">

                    </div>

                    <div class="input-group">

                        <label>Address</label>

                        <input type="text"
                               name="address"
                               value="{{ student.address }}"
                               placeholder="Address">

                    </div>

                    <div class="input-group">

                        <label>Phone Number</label>

                        <input type="text"
                               name="phone"
                               value="{{ student.phone }}"
                               placeholder="Phone Number">

                    </div>

                    <div class="input-group">

                        <label>Aadhaar Number</label>

                        <input type="text"
                               name="aadhaar"
                               value="{{ student.aadhaar }}"
                               placeholder="Aadhaar Number">

                    </div>

                    <div class="input-group">

                        <label>Department</label>

                        <input type="text"
                               name="department"
                               value="{{ student.department }}"
                               placeholder="Department">

                    </div>

                    <div class="input-group">

                        <label>Email</label>

                        <input type="email"
                               name="email"
                               value="{{ student.email }}"
                               placeholder="Email">

                    </div>

                    <div class="input-group">

                        <label>Course</label>

                        <input type="text"
                               name="course"
                               value="{{ student.course }}"
                               placeholder="Course">

                    </div>

                    <!-- GENDER -->

                    <div class="input-group">

                        <label>Gender</label>

                        <select name="gender" required>

                            <option value="">Select Gender</option>

                            <option value="Male"
                                {% if student.gender == 'Male' %}
                                    selected
                                {% endif %}>
                                Male
                            </option>

                            <option value="Female"
                                {% if student.gender == 'Female' %}
                                    selected
                                {% endif %}>
                                Female
                            </option>

                            <option value="Other"
                                {% if student.gender == 'Other' %}
                                    selected
                                {% endif %}>
                                Other
                            </option>

                        </select>

                    </div>

                </div>

                <!-- ================= EDUCATION DETAILS ================= -->

                <div class="section-title">
                    Education Details
                </div>

                <div class="table-container">

                    <table>

                        <tr>

                            <th>Standard</th>

                            <th>Year</th>

                            <th>School / College</th>

                            <th>Marks</th>

                        </tr>

                        {% for edu in education %}

                        <tr>

                            <td>

                                <input type="text"
                                       name="standard"
                                       value="{{ edu.standard }}">

                            </td>

                            <td>

                                <input type="text"
                                       name="year"
                                       value="{{ edu.year }}">

                            </td>

                            <td>

                                <input type="text"
                                       name="school_college"
                                       value="{{ edu.school_college }}">

                            </td>

                            <td>

                                <input type="text"
                                       name="marks"
                                       value="{{ edu.marks }}">

                            </td>

                        </tr>

                        {% endfor %}

                    </table>

                </div>

                <!-- ================= SUBMIT BUTTON ================= -->

                <button type="submit"
                        class="submit-btn">

                    <i class="fa-solid fa-floppy-disk"></i>
                    Update Student

                </button>

            </form>

        </div>

    </div>

</body>

</html>
