<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#1e3a8a,#2563eb);
            overflow:hidden;
        }

        /* Background Circles */

        .circle1,
        .circle2{
            position:absolute;
            border-radius:50%;
            background:rgba(255,255,255,0.1);
        }

        .circle1{
            width:300px;
            height:300px;
            top:-80px;
            left:-80px;
        }

        .circle2{
            width:250px;
            height:250px;
            bottom:-80px;
            right:-80px;
        }

        /* Login Container */

        .login-container{
            width:380px;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,0.2);
            padding:40px 30px;
            border-radius:20px;
            box-shadow:0 8px 30px rgba(0,0,0,0.2);
            text-align:center;
            position:relative;
            z-index:10;
            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .login-container h2{
            color:white;
            margin-bottom:10px;
            font-size:32px;
        }

        .login-container p{
            color:#dbeafe;
            margin-bottom:30px;
            font-size:14px;
        }

        /* Input Box */

        .input-box{
            position:relative;
            margin-bottom:22px;
        }

        .input-box input{
            width:100%;
            padding:14px 15px;
            border:none;
            outline:none;
            border-radius:12px;
            font-size:15px;
            background:rgba(255,255,255,0.2);
            color:white;
        }

        .input-box input::placeholder{
            color:#e0e7ff;
        }

        /* Login Button */

        .login-btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:white;
            color:#1e3a8a;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        .login-btn:hover{
            background:#dbeafe;
            transform:translateY(-2px);
        }

        /* Links */

        .links{
            margin-top:25px;
            display:flex;
            justify-content:space-between;
        }

        .links a{
            text-decoration:none;
            color:white;
            font-size:14px;
            transition:0.3s;
        }

        .links a:hover{
            color:#dbeafe;
        }

        /* Responsive */

        @media(max-width:450px){

            .login-container{
                width:90%;
                padding:30px 20px;
            }

            .links{
                flex-direction:column;
                gap:10px;
            }

        }

    </style>

</head>

<body>

    <!-- Background Design -->
    <div class="circle1"></div>
    <div class="circle2"></div>

    <!-- Login Form -->
    <div class="login-container">

        <h2>Welcome Back</h2>

        <p>Login to Student Management System</p>

        <form method="POST">

            <div class="input-box">
                <input type="email" name="email" placeholder="Enter Email" required>
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="links">

            <a href="/register">Create Account</a>

            <a href="/reset">Forgot Password?</a>

        </div>

    </div>

</body>

</html>
